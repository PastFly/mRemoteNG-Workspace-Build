name: Build mRemoteNG 1.76.20 Workspace MSI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the Workspace patch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and inspect the installer
        shell: pwsh
        run: .\Build-WorkspaceMsi.ps1
      - name: Store the installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mRemoteNG-1.76.20-Workspace-x86
          path: dist/*
          if-no-files-found: error
          retention-days: 14
